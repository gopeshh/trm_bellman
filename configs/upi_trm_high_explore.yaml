# UPI-TRM with HIGH EXPLORATION for 4x4 Sudoku
# Hypothesis: UPI-TRM needs more exploration to escape local minima

use_progress_checker: true
use_constraint_checker: false

# ===================================================================
# LATENT MODE - PERSISTENT
# ===================================================================
episodic_latent: false

# ===================================================================
# CORE RL PARAMETERS
# ===================================================================
gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 20

# ===================================================================
# HIGH EXPLORATION SETTINGS
# ===================================================================
entropy_coef: 0.2           # MUCH higher entropy for exploration
mixture_alpha: 0.2          # More aggressive policy updates

# ===================================================================
# THEORY-EXACT FEATURES
# ===================================================================
exact_k_step_targets: true
exact_baseline_summation: false  # Disabled for speed
theory_exact_mixture: true
distill_mixture_policy: false
batch_centered_advantage: true

# ===================================================================
# CONTRACTION & LIPSCHITZ
# ===================================================================
enable_contraction: true
target_Lz: 0.9
target_Lv: 1.0
latent_ball_radius: 10.0

# ===================================================================
# REWARD SHAPING - Less punishing
# ===================================================================
reward_shaping: true
fail_terminal_reward: -8.0    # Less punishing (was -16)
solve_terminal_reward: 10.0   # Positive reward for solving!
value_target_clip: 25.0       # More headroom

# ===================================================================
# STOP ACTION
# ===================================================================
stop_action_mode: "disabled"

# ===================================================================
# OPTIMIZATION - Higher learning rates
# ===================================================================
value_lr: 1.0e-3              # Higher value LR
policy_lr: 3.0e-4             # Higher policy LR

value_grad_clip: 5.0
policy_grad_clip: 1.0
lr_schedule: "constant"

# ===================================================================
# REPLAY & TRAINING
# ===================================================================
replay_capacity: 100000
batch_size: 128
num_train_steps: 5000
rollout_episodes_per_step: 4
rollout_batch_size: 32

# ===================================================================
# LOGGING & EVALUATION
# ===================================================================
log_interval: 10
eval_interval: 100
eval_num_episodes: 50
use_tqdm: false
debug_checks: false
track_theory_metrics: true
task_name: "sudoku"
solved_threshold: 16.0
