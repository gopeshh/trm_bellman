# Exp2 Contraction Sweep: target_Lz = 0.95 (moderate contraction)
#
# This is a moderate contraction point on the stability dial.
# Contraction enabled with stronger enforcement (Lz < 0.95).
#
# Base config matches Exp1 stable setup.

gamma: 0.99
K: 1
inner_unroll_n: 2
max_edits: 16

num_train_steps: 5000
batch_size: 32
rollout_episodes_per_step: 4

value_lr: 0.0003
policy_lr: 0.0001
value_grad_clip: 1.0
policy_grad_clip: 0.5

mixture_alpha: 0.1
policy_epsilon: 0.1
target_ema_tau: 0.99

entropy_coef: 0.05

# CONTRACTION: Enabled with target L_z = 0.95 (moderate)
enable_contraction: true
target_Lz: 0.95
disable_value_head_norm: true

value_target_clip: 50.0
advantage_clip: 10.0
batch_centered_advantage: true

log_interval: 50
eval_interval: 100
eval_num_episodes: 50

episodic_latent: true
latent_ball_radius: 10.0

use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0
reward_shaping: true
solve_terminal_reward: 1.0
fail_terminal_reward: -16.0
C_max: 16.0
solved_threshold: null

stop_action_mode: disabled
track_theory_metrics: true
