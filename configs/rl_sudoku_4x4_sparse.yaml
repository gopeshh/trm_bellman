# 4x4 Sudoku with SPARSE terminal rewards
# Clean reward signal: only final checker score matters

gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 16         # 4x4 grid = 16 cells max
num_train_steps: 10000
batch_size: 128
rollout_episodes_per_step: 8
mixture_alpha: 0.1
entropy_coef: 0.1     # High exploration
value_lr: 0.0003
policy_lr: 0.0003
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0
log_interval: 50
eval_interval: 100
eval_num_episodes: 100
value_grad_clip: 5.0
policy_grad_clip: 1.0
value_target_clip: 100.0
advantage_clip: 20.0
policy_epsilon: 0.1
target_ema_tau: 0.99
batch_centered_advantage: true

# Persistent latent - good for simple puzzles
episodic_latent: false

# SPARSE rewards - only terminal score
reward_shaping: false

# STOP disabled for 4x4
stop_action_mode: disabled

