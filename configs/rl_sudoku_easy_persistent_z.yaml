# Easy Sudoku with PERSISTENT latent z
# Good for easier puzzles where the model can accumulate knowledge across steps.
# The latent z acts like an RNN hidden state, initialized once per episode.

gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 45         # Easy puzzles only need ~35-40 edits
num_train_steps: 10000
batch_size: 128
rollout_episodes_per_step: 4
mixture_alpha: 0.05   # Slightly faster policy updates for easier task
entropy_coef: 0.05    # Moderate exploration
value_lr: 0.0001      # Standard LR
policy_lr: 0.0001
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0
log_interval: 50
eval_interval: 100
eval_num_episodes: 50
value_grad_clip: 5.0
policy_grad_clip: 1.0
value_target_clip: 100.0
advantage_clip: 20.0
policy_epsilon: 0.05
target_ema_tau: 0.995
batch_centered_advantage: true

# === KEY: Persistent latent mode ===
# z is initialized once per episode and carried across steps.
# This allows the model to accumulate information about the puzzle.
episodic_latent: false

# === Reward shaping ===
# For easier puzzles, sparse rewards may work better (cleaner signal)
# Set to false if you want terminal-only rewards
reward_shaping: true

# === STOP action ===
# For easy puzzles, disabling STOP forces the agent to make edits
stop_action_mode: disabled

# === Learning rate scheduling ===
lr_schedule: constant
lr_warmup_steps: 0
lr_min_factor: 1.0

