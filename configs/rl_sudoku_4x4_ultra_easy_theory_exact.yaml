# Ultra-easy 4x4 Sudoku: Theory-Exact Configuration
# ===================================================
# This config aligns with the paper's theoretical analysis:
# - Episodic latent (reset per episode) for clean MDP structure
# - K > 1 for tighter bounds via multi-step returns
# - exact_baseline_summation for Theorem 5.9 bounds
# - theory_exact_mixture for true CPI policy-space mixture
# - Strict fail_terminal_reward for rush-to-fail prevention
#
# Use rl_sudoku_4x4_ultra_easy.yaml for faster practical debugging.

gamma: 0.99
K: 3                  # Multi-step returns for tighter 1/(1-γ^K) bound
inner_unroll_n: 4
max_edits: 6          # Strict: 1-4 blanks should need ≤4-6 edits
num_train_steps: 10000
batch_size: 128
rollout_episodes_per_step: 8
mixture_alpha: 0.05   # Conservative CPI step size (theory-safe)
entropy_coef: 0.05    # Moderate exploration
value_lr: 0.0003
policy_lr: 0.0003
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0
log_interval: 50
eval_interval: 100
eval_num_episodes: 50
value_grad_clip: 5.0
policy_grad_clip: 1.0
value_target_clip: 50.0   # More headroom for K=3 multi-step targets
advantage_clip: 10.0
policy_epsilon: 0.1
target_ema_tau: 0.99
batch_centered_advantage: true

# === Theory-exact settings ===
episodic_latent: true           # Reset latent each episode (clean MDP)
exact_k_step_targets: true      # Use exact K-step returns
exact_baseline_summation: true  # Theorem 5.9 tight bound
theory_exact_mixture: true      # True policy-space CPI mixture
distill_mixture_policy: false   # No distillation (not in theory)

# Reward shaping with strict terminal penalty
reward_shaping: true
shaping_scale: 1.0

# === Absorbing state value (Paper Eq. 12, lines 677-678) ===
# For 4x4 Sudoku, checker returns [0, 10] scale
C_max: 10.0

# === Terminal rewards (Paper Remark 2.6) ===
# Strict fail penalty: -C_max for 4x4 Sudoku (checker range [0, 10])
solve_terminal_reward: 1.0
fail_terminal_reward: -10.0     # = -C_max, prevents rush-to-fail

# STOP disabled for simplicity
stop_action_mode: disabled

