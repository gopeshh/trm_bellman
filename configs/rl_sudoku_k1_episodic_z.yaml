# UPI-TRM configuration for Sudoku (K=1) with EPISODIC latent z
# In episodic mode, z is reinitialized from (x, y) at every step.
# Compare with rl_sudoku_k1_persistent_z.yaml (persistent mode) to see the effect.

gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 120
num_train_steps: 20000
batch_size: 64
rollout_episodes_per_step: 4
mixture_alpha: 0.01
entropy_coef: 0.1        # Higher entropy to prevent policy collapse
value_lr: 0.00003        # Lower LR for stability
policy_lr: 0.00005       # Lower LR to prevent policy collapse
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0
log_interval: 100
eval_interval: 100
eval_num_episodes: 100
value_grad_clip: 5.0
policy_grad_clip: 1.0
value_target_clip: 100.0
advantage_clip: 20.0
policy_epsilon: 0.1
target_ema_tau: 0.995
batch_centered_advantage: true  # Heuristic for variance reduction

# === KEY DIFFERENCE: Episodic latent mode ===
# When true, z is reinitialized from (x, y) at every step
episodic_latent: true

# === Learning rate scheduling ===
lr_schedule: constant
lr_warmup_steps: 0
lr_min_factor: 1.0

