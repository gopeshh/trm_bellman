# Sparse Rewards for Sudoku (Comparison Baseline)
#
# This configuration uses SPARSE (terminal-only) rewards as a baseline
# for comparison against shaped-reward experiments.
#
# Key difference from shaped-reward config:
# - reward_shaping: false
# - Agent only receives checker score at episode end (no intermediate feedback)
# - Harder credit assignment problem
#
# All other theory-exact features remain ENABLED for fair comparison.

# ===================================================================
# REWARD MODE (SPARSE - NO SHAPING)
# ===================================================================
reward_shaping: false  # Terminal rewards only (no potential-based shaping)

# Terminal rewards:
# With sparse rewards, these are the ONLY non-zero rewards
fail_terminal_reward: 0.0   # No reward for failing
solve_terminal_reward: 0.0  # Reward comes from checker score alone

# ===================================================================
# CORE RL PARAMETERS (Same as shaped config)
# ===================================================================
gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 120

# ===================================================================
# THEORY-EXACT FEATURES (Modified for sparse rewards)
# ===================================================================
exact_k_step_targets: true
# NOTE: exact_baseline_summation requires reward_shaping=True
# For sparse rewards, we use batch centering instead (heuristic)
exact_baseline_summation: false
batch_centered_advantage: true  # Batch-level centering for variance reduction
theory_exact_mixture: true
distill_mixture_policy: false

# ===================================================================
# CONTRACTION & LIPSCHITZ (Same as shaped config)
# ===================================================================
enable_contraction: true
target_Lz: 0.9
target_Lv: 1.0
latent_ball_radius: 10.0

# ===================================================================
# CONSERVATIVE POLICY IMPROVEMENT (Same as shaped config)
# ===================================================================
mixture_alpha: 0.05

# ===================================================================
# LATENT MODE (Same as shaped config)
# ===================================================================
episodic_latent: true

# ===================================================================
# STOP ACTION (Same as shaped config)
# ===================================================================
stop_action_mode: "noop"
stop_action_penalty: -0.1

# ===================================================================
# OPTIMIZATION (Same as shaped config)
# ===================================================================
value_lr: 3.0e-4
policy_lr: 3.0e-4
entropy_coef: 0.01
value_grad_clip: 5.0
policy_grad_clip: 1.0

lr_schedule: "cosine"
lr_warmup_steps: 500
lr_min_factor: 0.1

# ===================================================================
# REPLAY & TRAINING (Same as shaped config)
# ===================================================================
replay_capacity: 100000
batch_size: 256
num_train_steps: 10000
rollout_episodes_per_step: 4

# ===================================================================
# LOGGING & EVALUATION (Same as shaped config)
# ===================================================================
log_interval: 10
eval_interval: 50
eval_num_episodes: 50
use_tqdm: false
debug_checks: false
track_theory_metrics: true

# ===================================================================
# TASK CONFIGURATION (Same as shaped config)
# ===================================================================
task_name: "sudoku"
solved_threshold: 10.0

# ===================================================================
# EXPERIMENTAL NOTE
# ===================================================================
# This config tests: Can the agent learn from sparse terminal rewards alone?
# Expected: Slower learning, lower success rate than shaped-reward variant
#
# To compare:
# 1. Run shaped config:  configs/rl_sudoku_shaped_theory_exact.yaml
# 2. Run sparse config:  configs/rl_sudoku_sparse_theory_exact.yaml  (this file)
# 3. Compare metrics: success_rate, mean_score, episode_length, learning_speed
