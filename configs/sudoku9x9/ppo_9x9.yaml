# PPO Baseline for 9x9 Sudoku with Feasibility Checker
#
# Uses PPO algorithm with the TRM backbone and feasibility checker.
# Scaled from 4x4 config with appropriate adjustments for 9x9.
#
# Score = filled - w_v * violations - w_z * zeroCand
# Success = filled == N AND violations == 0

algorithm: "ppo"

# PPO hyperparameters
ppo_clip_eps: 0.2
ppo_epochs: 4
ppo_minibatch_size: 32
vf_coef: 0.5
ppo_num_steps: 128  # Larger rollouts for 9x9
normalize_advantages: true
clip_vf_loss: false

# Core RL
gamma: 0.99
inner_unroll_n: 2
max_edits: 81
num_train_steps: 25000

# === FEASIBILITY CHECKER ===
reward_shaping: true
use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0
use_progress_checker: false
use_constraint_checker: false
fail_terminal_reward: -81.0
solve_terminal_reward: 1.0
C_max: 81.0
solved_threshold: null  # Use sudoku_is_solved()

# Model
model_type: "trm"
enable_contraction: false
target_Lz: 0.9
target_Lv: 5.0
latent_ball_radius: 0.0

# Optimization
policy_lr: 1.0e-4
value_lr: 1.0e-4
entropy_coef: 0.05
max_grad_norm: 0.5
value_target_clip: 100.0

lr_schedule: "cosine"
lr_warmup_steps: 500
lr_min_factor: 0.1

# GAE
use_gae: true
gae_lambda: 0.95

# Training
batch_size: 256
rollout_episodes_per_step: 8

# Latent mode
episodic_latent: true

# Stop action
stop_action_mode: "disabled"

# Logging
log_interval: 100
eval_interval: 500
eval_num_episodes: 100
use_tqdm: true
track_theory_metrics: false

# Dataset
dataset_dir: "data/sudoku-9x9"
task_name: "sudoku"
