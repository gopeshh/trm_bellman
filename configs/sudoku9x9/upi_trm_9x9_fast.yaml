# UPI-TRM Fast-Run Config for 9x9 Sudoku
#
# Use this for quick debugging and iteration (~10 min runs)
# For paper results, use upi_trm_9x9.yaml instead
#
# Key differences from full config:
# - num_train_steps: 2000 (vs 50000)
# - rollout_episodes_per_step: 2 (vs 8) - 4x faster per step
# - inner_unroll_n: 1 (vs 2) - 2x faster policy forward
# - More frequent logging/eval for shorter runs

algorithm: "upi_trm"

gamma: 0.99
K: 1
inner_unroll_n: 1  # Reduced from 2 for faster forward pass

max_edits: 81  # 9x9 has 81 cells

num_train_steps: 2000  # Quick runs for debugging
batch_size: 64
rollout_episodes_per_step: 2  # Reduced from 8

value_lr: 0.0003
policy_lr: 0.0001
value_grad_clip: 1.0
policy_grad_clip: 0.5

# CPI settings
mixture_alpha: 0.1
policy_epsilon: 0.1
target_ema_tau: 0.99

entropy_coef: 0.05
enable_contraction: false
target_Lz: 0.9
disable_value_head_norm: true

# Clipping
value_target_clip: 100.0
advantage_clip: 20.0
batch_centered_advantage: true

log_interval: 20  # More frequent for short runs
eval_interval: 200  # More frequent for short runs
eval_num_episodes: 20  # Faster eval

episodic_latent: false

# === FEASIBILITY CHECKER ===
use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0

# Reward shaping
reward_shaping: true
solve_terminal_reward: 1.0
fail_terminal_reward: -81.0

stop_action_mode: disabled

C_max: 81.0
solved_threshold: null

dataset_dir: "data/sudoku-9x9"
task_name: "sudoku"

model_type: "trm"
latent_ball_radius: 10.0

track_theory_metrics: true
