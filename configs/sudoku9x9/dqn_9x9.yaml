# DQN Baseline for 9x9 Sudoku with Feasibility Checker
#
# Uses DQN/Double DQN algorithm with the TRM backbone and feasibility checker.
# Scaled from 4x4 config with appropriate adjustments for 9x9.
#
# Score = filled - w_v * violations - w_z * zeroCand
# Success = filled == N AND violations == 0

algorithm: "dqn"

# DQN hyperparameters
dqn_buffer_size: 50000  # Larger buffer for 9x9
dqn_batch_size: 128
dqn_learning_starts: 500  # More exploration before learning
dqn_train_freq: 4
dqn_target_update_interval: 500
dqn_exploration_fraction: 0.2
dqn_exploration_final_eps: 0.05
dqn_double_dqn: true

# Core RL
gamma: 0.99
inner_unroll_n: 2
max_edits: 81
num_train_steps: 50000

# === FEASIBILITY CHECKER ===
reward_shaping: true
use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0
use_progress_checker: false
use_constraint_checker: false
fail_terminal_reward: -81.0
solve_terminal_reward: 1.0
C_max: 81.0
solved_threshold: null

# Model
model_type: "trm"
enable_contraction: false
target_Lz: 0.9
target_Lv: 5.0
latent_ball_radius: 0.0

# Optimization
value_lr: 3.0e-4
value_target_clip: 100.0

lr_schedule: "constant"

# Training
batch_size: 256
rollout_episodes_per_step: 8

# Latent mode
episodic_latent: true

# Stop action
stop_action_mode: "disabled"

# Logging
log_interval: 100
eval_interval: 500
eval_num_episodes: 100
use_tqdm: true

# Dataset
dataset_dir: "data/sudoku-9x9"
task_name: "sudoku"
