# UPI-TRM for 9x9 Sudoku with Feasibility Checker (Episodic Latents)
#
# Same as upi_trm_9x9.yaml but with episodic latents to work around
# persistent latent hang issue on A100.
#
# Score = filled - w_v * violations - w_z * zeroCand
# Success = filled == N AND violations == 0

algorithm: "upi_trm"

gamma: 0.99
K: 1
inner_unroll_n: 2

max_edits: 81  # 9x9 has 81 cells

num_train_steps: 50000  # Increased for harder task with constraint masking
batch_size: 64
rollout_episodes_per_step: 8

value_lr: 0.0003
policy_lr: 0.0001
value_grad_clip: 1.0
policy_grad_clip: 0.5

# CPI settings
mixture_alpha: 0.1
policy_epsilon: 0.1
target_ema_tau: 0.99

entropy_coef: 0.05  # Encourage exploration
enable_contraction: false  # Contraction OFF per user request
target_Lz: 0.9
disable_value_head_norm: true  # Value normalization OFF

# Clipping adjusted for feasibility checker score range (can go negative)
value_target_clip: 100.0
advantage_clip: 20.0
batch_centered_advantage: true

log_interval: 100
eval_interval: 500
eval_num_episodes: 100

# CHANGED: episodic latent mode to work around persistent hang
episodic_latent: true  # Episodic z (reinit each step) - workaround for A100 hang

# === FEASIBILITY CHECKER ===
use_feasibility_checker: true
feasibility_violation_weight: 2.0  # w_v
feasibility_zerocand_weight: 5.0   # w_z

# Reward shaping
reward_shaping: true
solve_terminal_reward: 1.0
fail_terminal_reward: -81.0  # Scaled for 9x9

stop_action_mode: disabled

# C_max for feasibility checker (max score = 81 for solved 9x9)
C_max: 81.0
solved_threshold: null  # Use sudoku_is_solved() instead of score threshold

# Dataset
dataset_dir: "data/sudoku-9x9"
task_name: "sudoku"

# Model settings
model_type: "trm"
latent_ball_radius: 10.0

# Theory metrics
track_theory_metrics: true
