# PPO Sweep 4: Stronger reward shaping
algorithm: "ppo"

# PPO hyperparameters
ppo_clip_eps: 0.2
ppo_epochs: 4
ppo_minibatch_size: 16
vf_coef: 0.5
ppo_num_steps: 64
normalize_advantages: true
clip_vf_loss: false

# Core RL
gamma: 0.99
inner_unroll_n: 2
max_edits: 16
num_train_steps: 20000

# === FEASIBILITY CHECKER - STRONGER SHAPING ===
reward_shaping: true
use_feasibility_checker: true
feasibility_violation_weight: 5.0  # INCREASED from 2.0
feasibility_zerocand_weight: 10.0  # INCREASED from 5.0
use_progress_checker: false
use_constraint_checker: false
fail_terminal_reward: -32.0  # STRONGER penalty
solve_terminal_reward: 5.0   # STRONGER reward
C_max: 32.0
solved_threshold: null

# Model
model_type: "trm"
enable_contraction: false
target_Lz: 0.9
target_Lv: 5.0
latent_projection_mode: disabled
latent_ball_radius: null

# Optimization
policy_lr: 1.0e-4
value_lr: 1.0e-4
entropy_coef: 0.1
max_grad_norm: 0.5
value_target_clip: 100.0  # Increased for larger rewards

lr_schedule: "cosine"
lr_warmup_steps: 500
lr_min_factor: 0.1

# GAE
use_gae: true
gae_lambda: 0.95

# Training
batch_size: 256
rollout_episodes_per_step: 4

# Latent mode
episodic_latent: true

# Stop action
stop_action_mode: "disabled"

# Logging
log_interval: 50
eval_interval: 100
eval_num_episodes: 50
use_tqdm: true
track_theory_metrics: false

task_name: "sudoku"
