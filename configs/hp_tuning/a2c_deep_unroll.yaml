# A2C Sweep 2: Deeper TRM (more unroll steps)
algorithm: "a2c"

# A2C hyperparameters
a2c_num_steps: 32
vf_coef: 0.5
max_grad_norm: 0.5

# Core RL
gamma: 0.99
inner_unroll_n: 8  # INCREASED from 2
max_edits: 16
num_train_steps: 20000

# === FEASIBILITY CHECKER ===
reward_shaping: true
use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0
use_progress_checker: false
use_constraint_checker: false
fail_terminal_reward: -16.0
solve_terminal_reward: 1.0
C_max: 16.0
solved_threshold: null

# Model
model_type: "trm"
enable_contraction: false
target_Lz: 0.9
target_Lv: 5.0
latent_projection_mode: disabled
latent_ball_radius: null

# Optimization
policy_lr: 1.0e-4
value_lr: 1.0e-4
entropy_coef: 0.05
value_target_clip: 50.0

lr_schedule: "cosine"
lr_warmup_steps: 500
lr_min_factor: 0.1

# GAE
use_gae: true
gae_lambda: 0.95

# Training
batch_size: 256
rollout_episodes_per_step: 4

# Latent mode
episodic_latent: true

# Stop action
stop_action_mode: "disabled"

# Logging
log_interval: 50
eval_interval: 100
eval_num_episodes: 50
use_tqdm: true

task_name: "sudoku"
