# DQN Sweep 3: Larger buffer + more frequent updates
algorithm: "dqn"

# DQN hyperparameters - LARGER BUFFER, FASTER UPDATES
dqn_buffer_size: 50000  # INCREASED from 10000
dqn_batch_size: 128     # INCREASED from 64
dqn_learning_starts: 500
dqn_train_freq: 2       # FASTER: every 2 steps instead of 4
dqn_target_update_interval: 100  # More frequent target updates
dqn_exploration_fraction: 0.3
dqn_exploration_final_eps: 0.05
dqn_double_dqn: true
dqn_n_step: 1

# Core RL
gamma: 0.99
inner_unroll_n: 2
max_edits: 16
num_train_steps: 20000

# === FEASIBILITY CHECKER ===
reward_shaping: true
use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0
use_progress_checker: false
use_constraint_checker: false
fail_terminal_reward: -16.0
solve_terminal_reward: 1.0
C_max: 16.0
solved_threshold: null

# Model
model_type: "trm"
enable_contraction: false
target_Lz: 0.9
target_Lv: 5.0
latent_projection_mode: disabled
latent_ball_radius: null

# Optimization
value_lr: 1.0e-3  # HIGHER LR
value_target_clip: 50.0

lr_schedule: "cosine"
lr_warmup_steps: 1000
lr_min_factor: 0.1

# Training
batch_size: 256
rollout_episodes_per_step: 4

# Latent mode
episodic_latent: true

# Stop action
stop_action_mode: "disabled"

# Logging
log_interval: 50
eval_interval: 100
eval_num_episodes: 50
use_tqdm: true

task_name: "sudoku"
