# PPO Sweep 3: Higher learning rate with more epochs
algorithm: "ppo"

# PPO hyperparameters
ppo_clip_eps: 0.2
ppo_epochs: 10  # INCREASED from 4
ppo_minibatch_size: 16
vf_coef: 0.5
ppo_num_steps: 128  # INCREASED from 64
normalize_advantages: true
clip_vf_loss: false

# Core RL
gamma: 0.99
inner_unroll_n: 2
max_edits: 16
num_train_steps: 20000

# === FEASIBILITY CHECKER ===
reward_shaping: true
use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0
use_progress_checker: false
use_constraint_checker: false
fail_terminal_reward: -16.0
solve_terminal_reward: 1.0
C_max: 16.0
solved_threshold: null

# Model
model_type: "trm"
enable_contraction: false
target_Lz: 0.9
target_Lv: 5.0
latent_projection_mode: disabled
latent_ball_radius: null

# KEY CHANGE: Higher LR with more aggressive optimization
policy_lr: 3.0e-4  # INCREASED from 1e-4
value_lr: 3.0e-4
entropy_coef: 0.1  # Moderate increase
max_grad_norm: 0.5
value_target_clip: 50.0

lr_schedule: "cosine"
lr_warmup_steps: 1000
lr_min_factor: 0.05

# GAE
use_gae: true
gae_lambda: 0.95

# Training
batch_size: 256
rollout_episodes_per_step: 4

# Latent mode
episodic_latent: true

# Stop action
stop_action_mode: "disabled"

# Logging
log_interval: 50
eval_interval: 100
eval_num_episodes: 50
use_tqdm: true
track_theory_metrics: false

task_name: "sudoku"
