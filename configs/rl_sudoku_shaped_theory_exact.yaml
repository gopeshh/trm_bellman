# Theory-Exact Shaped Rewards for Sudoku (ICML 2026 Paper Alignment)
#
# This configuration enables ALL paper features for shaped-reward experiments:
# - Potential-based shaping: r = r_0 + γ·Φ(s') - Φ(s)  (Eq. 4)
# - Rush-to-fail mitigation: fail_terminal_reward = -C_max  (Remark 2.6)
# - Exact baseline summation for O(α·ε_A) bound  (Theorem 5.9 - KEY CONTRIBUTION)
# - Theory-exact CPI mixture (policy-space not parameter-space)  (Issue 4)
# - Forward-invariant projection  (Assumption 4.1)
# - Contraction enforcement  (Assumption 4.2)
#
# For 9×9 Sudoku: C_max = 10.0 (checker returns 10.0 for solved puzzles)

# ===================================================================
# REWARD SHAPING (Section 2.3, Remark 2.6)
# ===================================================================
reward_shaping: true  # Enable potential-based shaping Φ(s) = c(x, y)

# Terminal rewards for rush-to-fail mitigation (Paper Remark 2.6):
# With Φ(s_abs) = C_max and shaped rewards, the condition
# r_term_fail ≤ -γ·C_max ensures failing yields non-positive total reward.
#
# For Sudoku with C_max=10.0 and γ=0.99:
#   -γ·C_max = -0.99 * 10.0 = -9.9
# We use -10.0 for clean alignment with theory.
fail_terminal_reward: -10.0   # -C_max for theory alignment
solve_terminal_reward: 0.0    # Rely on shaping alone (no extra bonus)

# ===================================================================
# CORE RL PARAMETERS
# ===================================================================
gamma: 0.99
K: 1  # 1-step TD (baseline), increase to 3 or 5 for multi-step
inner_unroll_n: 4  # Latent unroll depth (dial 'n' in paper)
max_edits: 120  # Episode budget (increased for hard puzzles)

# ===================================================================
# THEORY-EXACT FEATURES (Section 5, Theorem 5.9)
# ===================================================================
# These toggles enable the paper's formal guarantees:

# 1. Exact K-step targets (Section 5.1)
#    Uses fixed-horizon γ^K bootstrap for T_K^π operator
exact_k_step_targets: true

# 2. Exact baseline summation (Theorem 5.9 - KEY CONTRIBUTION)
#    Computes E_{a~π}[Q̂(s,a)] via exact summation over discrete actions
#    This ensures E_{a~π}[Â(s,a)] = 0 EXACTLY for each state s
#    Enables O(α·ε_{A,0}) bound instead of naive O(ε_A/(1-γ))
exact_baseline_summation: true

# 3. Theory-exact CPI mixture (Issue 4)
#    Uses policy-space mixture π_new = (1-α)π + απ_0
#    NOT parameter-space interpolation (which doesn't preserve CPI guarantee)
theory_exact_mixture: true

# 4. NO distillation (Section 6.5)
#    Distillation is NOT covered by theory (introduces unanalyzed projection error)
distill_mixture_policy: false

# 5. Batch centering is HEURISTIC (not the exact centering from Theorem 5.9)
#    The theory requires exact_baseline_summation for true centering
batch_centered_advantage: false  # Disabled - we use exact baseline instead

# ===================================================================
# CONTRACTION & LIPSCHITZ (Assumption 4.1, 4.2)
# ===================================================================
enable_contraction: true
target_Lz: 0.9   # Dial 'L_z' - controls unrolling bias decay rate
target_Lv: 1.0   # Lipschitz constant for value head w.r.t. z

# Forward-invariant projection (Assumption 4.1 - CRITICAL)
# Projects latent z to ball of radius R after each update
# This ensures z ∈ Z_inv which is REQUIRED for contraction guarantees
latent_ball_radius: 10.0

# ===================================================================
# CONSERVATIVE POLICY IMPROVEMENT (Dial 'α')
# ===================================================================
mixture_alpha: 0.05  # Dial 'α' - conservative mixture weight
                     # Smaller α = safer updates, slower learning
                     # Evaluation-error penalty scales as O(α·ε_{A,0})

# ===================================================================
# LATENT MODE
# ===================================================================
episodic_latent: true  # Reset latent z at each step (reset-latent variant)
                       # Set to false for persistent-latent (original TRM)

# ===================================================================
# STOP ACTION BEHAVIOR
# ===================================================================
stop_action_mode: "noop"  # STOP is no-op, prevents early collapse
stop_action_penalty: -0.1  # Penalty for choosing STOP

# ===================================================================
# OPTIMIZATION
# ===================================================================
value_lr: 3.0e-4
policy_lr: 3.0e-4
entropy_coef: 0.01
value_grad_clip: 5.0
policy_grad_clip: 1.0

# LR schedule
lr_schedule: "cosine"
lr_warmup_steps: 500
lr_min_factor: 0.1

# ===================================================================
# REPLAY & TRAINING
# ===================================================================
replay_capacity: 100000
batch_size: 256
num_train_steps: 10000
rollout_episodes_per_step: 4

# ===================================================================
# LOGGING & EVALUATION
# ===================================================================
log_interval: 10
eval_interval: 50
eval_num_episodes: 50
use_tqdm: false  # Cleaner log output
debug_checks: false

# Track theory metrics (C_z, L_z, L_v, Bellman residual, unrolling term)
track_theory_metrics: true

# ===================================================================
# TASK CONFIGURATION
# ===================================================================
task_name: "sudoku"
solved_threshold: 10.0  # C_max for Sudoku checker

# ===================================================================
# VALIDATION
# ===================================================================
# This config should pass validate_theory_alignment() with NO warnings
# and is_theory_exact() should return True.
