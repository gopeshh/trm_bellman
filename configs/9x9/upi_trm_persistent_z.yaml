# UPI-TRM Persistent z for 9x9 Sudoku
#
# Uses progress checker for informative rewards
# 9x9 grid = 81 cells, approximately 49-56 empty (hard difficulty)

# ===================================================================
# PROGRESS CHECKER (KEY FEATURE)
# ===================================================================
use_progress_checker: true
use_constraint_checker: false

# ===================================================================
# LATENT MODE - PERSISTENT
# ===================================================================
episodic_latent: false  # z initialized ONCE per episode, carried across steps

# ===================================================================
# CORE RL PARAMETERS
# ===================================================================
gamma: 0.99
K: 1                   # 1-step TD
inner_unroll_n: 4      # Latent unroll depth
max_edits: 100         # Episode budget for 9x9 Sudoku (more cells to fill)

# ===================================================================
# THEORY-EXACT FEATURES
# ===================================================================
exact_k_step_targets: true
exact_baseline_summation: false  # DISABLED: incompatible with persistent z
theory_exact_mixture: true       # Policy-space CPI mixture
distill_mixture_policy: false
batch_centered_advantage: true   # Use batch centering as heuristic

# ===================================================================
# CONTRACTION & LIPSCHITZ
# ===================================================================
enable_contraction: true
target_Lz: 0.9
target_Lv: 1.0
latent_ball_radius: 10.0

# ===================================================================
# CONSERVATIVE POLICY IMPROVEMENT
# ===================================================================
mixture_alpha: 0.05

# ===================================================================
# REWARD SHAPING
# ===================================================================
reward_shaping: true
fail_terminal_reward: -81.0   # -C_max for 9x9 (C_max=81)
solve_terminal_reward: 0.0

# ===================================================================
# STOP ACTION
# ===================================================================
stop_action_mode: "disabled"  # Force agent to use full budget

# ===================================================================
# VALUE CLIPPING (must match score range)
# ===================================================================
value_target_clip: 100.0  # Progress checker range 0-81, add headroom

# ===================================================================
# OPTIMIZATION
# ===================================================================
value_lr: 3.0e-4
policy_lr: 1.0e-4
entropy_coef: 0.05            # Higher entropy for exploration
value_grad_clip: 5.0
policy_grad_clip: 1.0

# LR schedule - constant for stability
lr_schedule: "constant"
lr_warmup_steps: 0
lr_min_factor: 1.0

# ===================================================================
# REPLAY & TRAINING
# ===================================================================
replay_capacity: 100000
batch_size: 128
num_train_steps: 10000        # More steps for harder task
rollout_episodes_per_step: 4
rollout_batch_size: 32

# ===================================================================
# LOGGING & EVALUATION
# ===================================================================
log_interval: 10
eval_interval: 200
eval_num_episodes: 50
use_tqdm: false
debug_checks: false
track_theory_metrics: true

# ===================================================================
# TASK CONFIGURATION
# ===================================================================
task_name: "sudoku"
solved_threshold: 81.0  # Progress checker: 81 = all cells filled
