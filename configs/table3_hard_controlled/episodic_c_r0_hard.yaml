# Table 3 Hard Controlled: Episodic-z, Contraction, R=0 (C-R0)
#
# 2x2 controlled experiment to deconfound contraction vs projection effects
# on hard 4x4 Sudoku (6-8 empties).
#
# Cell: enable_contraction=true, latent_ball_radius=0.0 (projection disabled)
#
# CRITICAL CONTROLS (per CLAUDE.md non-negotiables):
# - disable_value_head_norm: true (MUST be true for ALL cells in this 2x2)
# - use_feasibility_checker: true
# - episodic_latent: true (same TRM variant across all cells)
# - num_train_steps: 20000 (matched to existing hard experiments)
# - Dataset: data/sudoku-4x4-easy_6to8empties (passed via CLI)

gamma: 0.99
K: 1
inner_unroll_n: 2
max_edits: 16  # T=16 horizon

# === TRAINING BUDGET (matched to existing hard experiments) ===
num_train_steps: 20000
batch_size: 32
rollout_episodes_per_step: 4

# === OPTIMIZATION ===
value_lr: 0.0003
policy_lr: 0.0001
value_grad_clip: 1.0
policy_grad_clip: 0.5

mixture_alpha: 0.1
policy_epsilon: 0.1
target_ema_tau: 0.99

entropy_coef: 0.05

# === 2x2 FACTORS ===
# FACTOR A: Contraction ON
enable_contraction: true
target_Lz: 0.9

# FACTOR B: Projection OFF (R=0)
latent_ball_radius: 0.0

# === CRITICAL CONTROL: Value-head normalization OFF ===
# MUST be true for ALL cells in this 2x2 to avoid confound
disable_value_head_norm: true

# === CLIPPING (matched across all cells) ===
value_target_clip: 50.0
advantage_clip: 10.0
batch_centered_advantage: true

# === EVALUATION (matched to existing hard experiments) ===
log_interval: 50
eval_interval: 100
eval_num_episodes: 50

# === TRM VARIANT: Episodic-z (same for all cells) ===
episodic_latent: true

# === CHECKER: Feasibility (required per CLAUDE.md) ===
use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0
reward_shaping: true
solve_terminal_reward: 1.0
fail_terminal_reward: -16.0
C_max: 16.0
solved_threshold: null

stop_action_mode: disabled

# === METRICS TRACKING ===
track_theory_metrics: true
