algo: "ppo"
algo_variant: "cleanrl_ppo_cartpole"
backend: "cleanrl"
env_kind: "cartpole"
env_id: "CartPole-v1"

seed: 0
device: "cpu"
torch_deterministic: true

total_timesteps: 100000
num_envs: 4
num_steps: 125
num_minibatches: 4
update_epochs: 4

learning_rate: 2.5e-4
anneal_lr: true
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
clip_vloss: true
norm_adv: true
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

obs_dim: 4
action_dim: 2
hidden_dim: 64

eval_interval: 5000
eval_episodes: 20
log_interval: 5

output_root: "results/cleanrl_cartpole_smoke"
