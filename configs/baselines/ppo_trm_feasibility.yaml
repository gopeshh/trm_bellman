# PPO Baseline with Feasibility Checker for 4x4 Sudoku
#
# Uses PPO algorithm with the TRM backbone and the new feasibility checker
# that provides dense, non-misleading learning signal.
#
# Score = filled - w_v * violations - w_z * zeroCand
# Success = filled == N AND violations == 0
#
# TUNED: Disabled contraction (matches best UPI-TRM variant), lowered policy LR

algorithm: "ppo"

# PPO hyperparameters
ppo_clip_eps: 0.2
ppo_epochs: 4
# MINIBATCH CONFIGURATION:
# Option A: ppo_num_minibatches - number of minibatches per epoch (takes precedence)
# Option B: ppo_minibatch_size - size in samples => num_minibatches = num_steps // size
# With ppo_num_steps=64 and ppo_minibatch_size=16 => 4 minibatches of 16 samples each
ppo_minibatch_size: 16
vf_coef: 0.5
ppo_num_steps: 64  # Reduced from 128 for faster updates on short episodes
normalize_advantages: true
clip_vf_loss: false

# Core RL
gamma: 0.99
inner_unroll_n: 2
max_edits: 16
num_train_steps: 5000

# === FEASIBILITY CHECKER ===
reward_shaping: true
use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0
use_progress_checker: false
use_constraint_checker: false
fail_terminal_reward: -16.0
solve_terminal_reward: 1.0
C_max: 16.0
solved_threshold: null  # Use sudoku_is_solved()

# Model
model_type: "trm"
enable_contraction: false  # FIXED: Contraction hurts on this task
target_Lz: 0.9  # Ignored when contraction disabled
target_Lv: 5.0
latent_ball_radius: 0.0  # Disabled with contraction

# Optimization
policy_lr: 1.0e-4  # FIXED: Lowered from 3e-4 for stability
value_lr: 1.0e-4
entropy_coef: 0.05
max_grad_norm: 0.5
value_target_clip: 50.0

lr_schedule: "cosine"
lr_warmup_steps: 200
lr_min_factor: 0.1

# GAE
use_gae: true
gae_lambda: 0.95

# Training
batch_size: 256
rollout_episodes_per_step: 4

# Latent mode
episodic_latent: true

# Stop action
stop_action_mode: "disabled"

# Logging
log_interval: 50
eval_interval: 100
eval_num_episodes: 50
use_tqdm: true
track_theory_metrics: false

task_name: "sudoku"
