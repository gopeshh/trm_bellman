# In-house DQN wrapper — hard 4x4 Sudoku, no-mask variant.
# Values copied from dqn_trm_feasibility.yaml + no_mask_overlay.yaml.
# This is NOT a CleanRL DQN; it wraps the in-house DQNTrainer.
algo: "dqn"
algo_variant: "inhouse_dqn_wrapper"
backend: "inhouse_dqn_wrapper"
env_kind: "sudoku"

dataset_path: "data/sudoku-4x4-easy_6to8empties"
train_split: "train"
eval_split: "test"
eval_pool_size: 50
seed: 0
device: "cuda"

# DQN hyperparameters (exact copy from dqn_trm_feasibility.yaml)
total_timesteps: 320000
learning_rate: 5.0e-4
gamma: 0.99
buffer_size: 10000
dqn_batch_size: 64
learning_starts: 200
train_freq: 4
target_update_freq: 200
epsilon_start: 1.0
epsilon_end: 0.05
exploration_fraction: 0.15
max_grad_norm: 10.0
double_dqn: true
n_step: 1

# Environment (matched to in-house)
max_edits: 16
reward_shaping: true
solved_threshold: null
stop_action_mode: "disabled"
disable_constraint_masking: true
fail_terminal_reward: -16.0
solve_terminal_reward: 1.0

# Checker
use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0
use_progress_checker: false
use_constraint_checker: false

# TRM model
hidden_size: 64
h_cycles: 2
l_cycles: 2
l_layers: 1
inner_unroll_n: 2
enable_contraction: false
target_Lz: 0.9
target_Lv: 5.0
latent_projection_mode: disabled
latent_ball_radius: null

batch_size: 256

eval_interval: 10000
eval_episodes: 50
log_interval: 1000

output_root: "results/cleanrl_benchmark/hard4x4"
