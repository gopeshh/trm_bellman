# DQN Baseline with Feasibility Checker for 4x4 Sudoku
#
# Uses DQN/Double DQN algorithm with the TRM backbone and the new feasibility checker.
#
# Score = filled - w_v * violations - w_z * zeroCand
# Success = filled == N AND violations == 0
#
# TUNED: Disabled contraction, faster exploration decay, earlier learning start

algorithm: "dqn"

# DQN hyperparameters
dqn_buffer_size: 10000  # Reduced - don't need huge buffer for 4x4
dqn_batch_size: 64
dqn_learning_starts: 200  # FIXED: Start learning earlier (was 500)
dqn_train_freq: 4
dqn_target_update_interval: 200  # FIXED: More frequent target updates
dqn_exploration_fraction: 0.15  # FIXED: Faster exploration decay (was 0.3)
dqn_exploration_final_eps: 0.05
dqn_double_dqn: true
dqn_n_step: 1

# Core RL
gamma: 0.99
inner_unroll_n: 2
max_edits: 16
num_train_steps: 5000

# === FEASIBILITY CHECKER ===
reward_shaping: true
use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0
use_progress_checker: false
use_constraint_checker: false
fail_terminal_reward: -16.0
solve_terminal_reward: 1.0
C_max: 16.0
solved_threshold: null

# Model
model_type: "trm"
enable_contraction: false  # FIXED: Contraction hurts on this task
target_Lz: 0.9  # Ignored when contraction disabled
target_Lv: 5.0
latent_projection_mode: disabled
latent_ball_radius: null

# Optimization
value_lr: 5.0e-4  # FIXED: Lowered from 1e-3 for stability
value_target_clip: 50.0

lr_schedule: "constant"

# Training
batch_size: 256
rollout_episodes_per_step: 4

# Latent mode
episodic_latent: true

# Stop action
stop_action_mode: "disabled"

# Logging
log_interval: 50
eval_interval: 100
eval_num_episodes: 50
use_tqdm: true

task_name: "sudoku"
