# PPO Baseline with No-Recursion Encoder for Sudoku
#
# This config uses PPO algorithm with a simple encoder (no TRM recursion).
# Tests whether TRM's recursive refinement provides benefits over direct approach.
#
# Key differences from PPO-TRM:
# - Uses MLPEncoder or TransformerEncoder instead of TRM
# - No z^(0) -> z^(n) inner recursion (n parameter is ignored)
# - Simpler architecture, fewer parameters
# - Direct feedforward encoding of (x, y)

# ===================================================================
# PPO-SPECIFIC PARAMETERS
# ===================================================================
algorithm: "ppo"

# PPO hyperparameters
ppo_clip_eps: 0.2
ppo_epochs: 4
ppo_minibatch_size: 64
vf_coef: 0.5

# PPO rollout collection
ppo_num_steps: 128
normalize_advantages: true
clip_vf_loss: false

# ===================================================================
# CORE RL PARAMETERS
# ===================================================================
gamma: 0.99
inner_unroll_n: 0  # IGNORED by NoRecursionEncoder
max_edits: 120
num_train_steps: 20000

# ===================================================================
# REWARD CONFIGURATION
# ===================================================================
reward_shaping: true
fail_terminal_reward: -10.0
solve_terminal_reward: 0.0

# ===================================================================
# MODEL ARCHITECTURE
# ===================================================================
model_type: "norec"  # Use no-recursion encoder (MLP or Transformer)
norec_encoder_type: "mlp"  # Options: "mlp" or "transformer"
norec_num_layers: 2
norec_hidden_dim: 128
norec_num_heads: 4  # For transformer only
norec_dropout: 0.1

# These are IGNORED by NoRecursionEncoder but kept for compatibility
enable_contraction: false  # Not applicable to no-rec encoder
target_Lz: 0.9
target_Lv: 5.0
latent_ball_radius: 0.0  # Disabled for no-rec

# ===================================================================
# OPTIMIZATION
# ===================================================================
policy_lr: 3.0e-4
value_lr: 1.0e-4
entropy_coef: 0.01
max_grad_norm: 0.5

lr_schedule: "cosine"
lr_warmup_steps: 500
lr_min_factor: 0.1

# ===================================================================
# GAE PARAMETERS
# ===================================================================
use_gae: true
gae_lambda: 0.95

# ===================================================================
# TRAINING
# ===================================================================
batch_size: 256
rollout_episodes_per_step: 4

# ===================================================================
# LATENT MODE
# ===================================================================
episodic_latent: true  # N/A for no-rec but kept for interface

# ===================================================================
# STOP ACTION
# ===================================================================
stop_action_mode: "noop"
stop_action_penalty: -0.1

# ===================================================================
# LOGGING & EVALUATION
# ===================================================================
log_interval: 100
eval_interval: 500
eval_num_episodes: 50
use_tqdm: false
track_theory_metrics: false

# ===================================================================
# TASK CONFIGURATION
# ===================================================================
task_name: "sudoku"
solved_threshold: 10.0

# ===================================================================
# DISABLED THEORY FEATURES
# ===================================================================
exact_baseline_summation: false
exact_k_step_targets: false
theory_exact_mixture: false
batch_centered_advantage: false