algo: "ppo"
algo_variant: "cleanrl_ppo_sudoku_smoke"
backend: "cleanrl"
env_kind: "sudoku"

seed: 0
device: "cpu"
torch_deterministic: true

dataset_path: "data/sudoku-4x4-easy_6to8empties"
train_split: "train"
eval_split: "test"
eval_pool_size: 10
max_edits: 16
gamma: 0.99
reward_shaping: true
solved_threshold: 1.0
disable_constraint_masking: true
stop_action_mode: "noop"

total_timesteps: 10000
num_envs: 1
num_steps: 64
num_minibatches: 4
update_epochs: 4

learning_rate: 2.5e-4
anneal_lr: true
gae_lambda: 0.95
clip_coef: 0.2
clip_vloss: true
norm_adv: true
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

hidden_size: 64
h_cycles: 2
l_cycles: 2
l_layers: 1
inner_unroll_n: 2

eval_interval: 2000
eval_episodes: 10
log_interval: 5

output_root: "results/cleanrl_ppo_sudoku_smoke"
