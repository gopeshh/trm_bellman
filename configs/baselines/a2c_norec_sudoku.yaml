# A2C Baseline with No-Recursion Encoder for Sudoku
#
# This is the simplest baseline: A2C algorithm with simple MLP/Transformer encoder.
# No TRM recursion, no clipping, single-step updates.
#
# Key differences from other baselines:
# - Simplest algorithm (A2C)
# - Simplest encoder (MLP/Transformer, no recursion)
# - Fewest parameters
# - Fastest training but likely lowest performance

# ===================================================================
# A2C-SPECIFIC PARAMETERS
# ===================================================================
algorithm: "a2c"

# A2C hyperparameters
a2c_num_steps: 5
vf_coef: 0.5
normalize_advantages: false

# ===================================================================
# CORE RL PARAMETERS
# ===================================================================
gamma: 0.99
inner_unroll_n: 0  # IGNORED by NoRecursionEncoder
max_edits: 120
num_train_steps: 20000

# ===================================================================
# REWARD CONFIGURATION
# ===================================================================
reward_shaping: true
fail_terminal_reward: -10.0
solve_terminal_reward: 0.0

# ===================================================================
# MODEL ARCHITECTURE
# ===================================================================
model_type: "norec"  # Use no-recursion encoder
norec_encoder_type: "mlp"  # Options: "mlp" or "transformer"
norec_num_layers: 2
norec_hidden_dim: 128
norec_num_heads: 4
norec_dropout: 0.1

# Not applicable to no-rec encoder
enable_contraction: false
target_Lz: 0.9
target_Lv: 5.0
latent_ball_radius: 0.0

# ===================================================================
# OPTIMIZATION
# ===================================================================
lr: 7.0e-4  # Single LR for A2C
entropy_coef: 0.01
max_grad_norm: 0.5

rmsprop_alpha: 0.99
rmsprop_eps: 1.0e-5

# ===================================================================
# GAE PARAMETERS
# ===================================================================
use_gae: true
gae_lambda: 0.95

# ===================================================================
# TRAINING
# ===================================================================
batch_size: 64
rollout_episodes_per_step: 4

# ===================================================================
# LATENT MODE
# ===================================================================
episodic_latent: true  # N/A for no-rec but kept for interface

# ===================================================================
# STOP ACTION
# ===================================================================
stop_action_mode: "noop"
stop_action_penalty: -0.1

# ===================================================================
# LOGGING & EVALUATION
# ===================================================================
log_interval: 100
eval_interval: 500
eval_num_episodes: 50
use_tqdm: false
track_theory_metrics: false

# ===================================================================
# TASK CONFIGURATION
# ===================================================================
task_name: "sudoku"
solved_threshold: 10.0

# ===================================================================
# DISABLED THEORY FEATURES
# ===================================================================
exact_baseline_summation: false
exact_k_step_targets: false
theory_exact_mixture: false
batch_centered_advantage: false