# A2C Baseline with TRM Backbone for Sudoku
#
# This config uses A2C algorithm with the TRM latent recursion backbone.
# A2C is a simpler baseline than PPO with single-step updates.
#
# Key differences from UPI-TRM:
# - No clipping or policy constraint (vanilla policy gradient)
# - Single gradient step per rollout (no epochs)
# - Standard GAE without exact baseline summation
# - Uses RMSprop optimizer (standard for A2C)

# ===================================================================
# A2C-SPECIFIC PARAMETERS
# ===================================================================
algorithm: "a2c"  # Selects A2C trainer instead of UPI-TRM

# A2C hyperparameters
a2c_num_steps: 5  # Steps per rollout (smaller than PPO)
vf_coef: 0.5  # Value function loss coefficient
normalize_advantages: false  # A2C typically doesn't normalize

# ===================================================================
# CORE RL PARAMETERS
# ===================================================================
gamma: 0.99
inner_unroll_n: 4  # Use TRM latent recursion
max_edits: 20  # Match ablation configs
num_train_steps: 5000  # Match ablation configs

# ===================================================================
# REWARD CONFIGURATION
# ===================================================================
reward_shaping: true
use_progress_checker: true
use_constraint_checker: false
fail_terminal_reward: -16.0  # -C_max for progress checker (C_max=16)
solve_terminal_reward: 0.0

# ===================================================================
# MODEL ARCHITECTURE
# ===================================================================
model_type: "trm"  # Use TRM backbone (not no-recursion)
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0
latent_ball_radius: 10.0

# ===================================================================
# OPTIMIZATION
# ===================================================================
# A2C uses single learning rate with RMSprop
lr: 7.0e-4  # Single LR for A2C
entropy_coef: 0.01
max_grad_norm: 0.5

# RMSprop settings (standard for A2C)
rmsprop_alpha: 0.99
rmsprop_eps: 1.0e-5

# ===================================================================
# GAE PARAMETERS
# ===================================================================
use_gae: true
gae_lambda: 0.95

# ===================================================================
# TRAINING
# ===================================================================
batch_size: 64  # Batch size for updates
rollout_episodes_per_step: 4

# ===================================================================
# LATENT MODE
# ===================================================================
episodic_latent: true  # Reset latent at each step

# ===================================================================
# STOP ACTION
# ===================================================================
stop_action_mode: "noop"
stop_action_penalty: -0.1

# ===================================================================
# LOGGING & EVALUATION
# ===================================================================
log_interval: 100
eval_interval: 500
eval_num_episodes: 50
use_tqdm: false
track_theory_metrics: false  # A2C doesn't enforce theory

# ===================================================================
# TASK CONFIGURATION
# ===================================================================
task_name: "sudoku"
solved_threshold: 16.0  # Progress checker: 16 = all cells filled

# ===================================================================
# DISABLED THEORY FEATURES
# ===================================================================
exact_baseline_summation: false  # A2C uses standard advantages
exact_k_step_targets: false  # A2C uses GAE
theory_exact_mixture: false  # A2C uses no mixture
batch_centered_advantage: false