# Single puzzle training - verify RL works on simplest case

gamma: 0.99
K: 1
inner_unroll_n: 1

max_edits: 8

num_train_steps: 10000
batch_size: 32
rollout_episodes_per_step: 8

value_lr: 0.001
policy_lr: 0.003
value_grad_clip: 1.0
policy_grad_clip: 1.0

# Very aggressive policy updates
mixture_alpha: 0.8
policy_epsilon: 0.3
target_ema_tau: 0.9

entropy_coef: 0.1
enable_contraction: false
value_target_clip: 20.0
advantage_clip: 10.0
batch_centered_advantage: true

log_interval: 100
eval_interval: 200
eval_num_episodes: 50

episodic_latent: true

# Simple reward: just score improvement
reward_shaping: true
solve_terminal_reward: 5.0
fail_terminal_reward: 0.0

stop_action_mode: disabled

