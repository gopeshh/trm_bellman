# Exp3: Contraction + R=disabled (C-Rdis)
#
# Training-time projection ablation experiment.
# Condition: Contraction enabled, NO projection.
# This tests "contraction-only" stability without projection artifacts.
# WARNING: May be unstable - abort early if NaN/collapse.
#
# Per CLAUDE.md non-negotiables:
# - use_feasibility_checker: true
# - disable_value_head_norm: true (CRITICAL for stability experiments)

gamma: 0.99
K: 1
inner_unroll_n: 2
max_edits: 16

num_train_steps: 5000
batch_size: 32
rollout_episodes_per_step: 4

value_lr: 0.0003
policy_lr: 0.0001
value_grad_clip: 1.0
policy_grad_clip: 0.5

mixture_alpha: 0.1
policy_epsilon: 0.1
target_ema_tau: 0.99

entropy_coef: 0.05

# CONTRACTION: Enabled with target L_z = 0.9
enable_contraction: true
target_Lz: 0.9
# CRITICAL: Value-head normalization OFF to avoid collapse
disable_value_head_norm: true

value_target_clip: 50.0
advantage_clip: 10.0
batch_centered_advantage: true

log_interval: 50
eval_interval: 100
eval_num_episodes: 50

episodic_latent: true

# PROJECTION: Explicit identity mode
latent_projection_mode: disabled
latent_ball_radius: null

# Feasibility checker
use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0
reward_shaping: true
solve_terminal_reward: 1.0
fail_terminal_reward: -16.0
C_max: 16.0
solved_threshold: null

stop_action_mode: disabled

# Theory tracking for analysis
track_theory_metrics: true
