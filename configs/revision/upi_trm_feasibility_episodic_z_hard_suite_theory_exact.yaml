# Episodic-z hard-suite rerun config for the NeurIPS revision workflow.
#
# This starts from the persistent-z no-mask hard-suite anchor and changes only
# the latent mode and exact-centering / exact-mixture requirements locked in
# UPI_TRM_NIPS/EXPERIMENTS_PROTOCOL.md.

gamma: 0.99
K: 1
inner_unroll_n: 2

max_edits: 16

num_train_steps: 20000
batch_size: 32
rollout_episodes_per_step: 4

value_lr: 0.0003
policy_lr: 0.0001
value_grad_clip: 1.0
policy_grad_clip: 0.5

mixture_alpha: 0.1
policy_epsilon: 0.0
target_ema_tau: 0.99

entropy_coef: 0.05

enable_contraction: false
target_Lz: 0.9
target_Lv: 1.0
latent_ball_radius: 10.0

value_target_clip: 50.0
advantage_clip: 10.0
batch_centered_advantage: false

exact_k_step_targets: true
exact_baseline_summation: true
theory_exact_mixture: true
distill_mixture_policy: false

log_interval: 50
eval_interval: 100
eval_num_episodes: 50

episodic_latent: true

use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0
disable_constraint_masking: true

reward_shaping: true
solve_terminal_reward: 1.0
fail_terminal_reward: -16.0

stop_action_mode: disabled

C_max: 16.0
solved_threshold: null
