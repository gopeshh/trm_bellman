# Easy Sudoku with SPARSE terminal rewards
# Hypothesis: Shaping is too noisy, direct terminal signal is cleaner

gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 40         # Easy puzzles need ~35 edits max
num_train_steps: 10000
batch_size: 256
rollout_episodes_per_step: 8
mixture_alpha: 0.1
entropy_coef: 0.1
value_lr: 0.0003
policy_lr: 0.0003
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0
log_interval: 50
eval_interval: 100
eval_num_episodes: 50
value_grad_clip: 5.0
policy_grad_clip: 1.0
value_target_clip: 100.0
advantage_clip: 20.0
policy_epsilon: 0.1
target_ema_tau: 0.99
batch_centered_advantage: true
episodic_latent: true
lr_schedule: constant
stop_action_mode: disabled

# KEY: Disable reward shaping - use terminal score only
reward_shaping: false

