# 4x4 Sudoku TRIVIAL - 1-4 empties for debugging
# This config tests feasibility checker on truly easy puzzles

gamma: 0.99
K: 1
inner_unroll_n: 2

max_edits: 16

num_train_steps: 2000
batch_size: 32
rollout_episodes_per_step: 4

value_lr: 0.0003
policy_lr: 0.0001
value_grad_clip: 1.0
policy_grad_clip: 0.5

mixture_alpha: 0.1
policy_epsilon: 0.1
target_ema_tau: 0.99

entropy_coef: 0.05
enable_contraction: true
target_Lz: 0.9

value_target_clip: 50.0
advantage_clip: 10.0
batch_centered_advantage: true

log_interval: 50
eval_interval: 100
eval_num_episodes: 50

episodic_latent: true

# Feasibility checker
use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0

reward_shaping: true
solve_terminal_reward: 1.0
fail_terminal_reward: -16.0

stop_action_mode: disabled

C_max: 16.0
solved_threshold: null
