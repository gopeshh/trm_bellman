# Easy Sudoku v2: With reward scaling and adjusted hyperparameters
# Key insight: checker scores are 0-81, but we need larger reward signals

gamma: 0.99
K: 1                  # Simpler 1-step TD for more stable learning
inner_unroll_n: 4
max_edits: 40         # Fewer edits for easier puzzles (only need ~35)
num_train_steps: 10000
batch_size: 256       # Larger batch for more stable gradients
rollout_episodes_per_step: 8
mixture_alpha: 0.1    # Faster policy updates (was 0.05)
entropy_coef: 0.1     # More exploration to escape local optima
value_lr: 0.0003      # Higher value LR (was 0.0001)
policy_lr: 0.0003     # Higher policy LR (was 0.0001)
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0
log_interval: 50
eval_interval: 100
eval_num_episodes: 50
value_grad_clip: 5.0
policy_grad_clip: 1.0
value_target_clip: 200.0   # Allow larger values
advantage_clip: 50.0       # Allow larger advantages
policy_epsilon: 0.15       # More random exploration early
target_ema_tau: 0.99
batch_centered_advantage: true
episodic_latent: true      # Simpler episodic mode first
lr_schedule: constant
lr_warmup_steps: 0
lr_min_factor: 1.0
stop_action_mode: disabled  # Disable STOP entirely - just learn to edit

# CRITICAL: Multiply checker scores for larger rewards
# (This requires code change - see below)

