# PAPER EXPERIMENT: Persistent z with Constraint Checker
#
# This config is paired with paper_episodic_z_constraint.yaml
# The ONLY difference is episodic_latent: false vs true
#
# Uses constraint-based checker for dense intermediate reward signals
# (rewards reducing row/column/box violations, not just solution matching)
#
# NOTE: With persistent z, Theorem 5.9 does NOT strictly apply.
# We still enable exact_baseline_summation as a heuristic, but the
# theoretical guarantee is via Lemma 4.4 (two-timescale bound).

# ===================================================================
# PROGRESS CHECKER (KEY FEATURE)
# ===================================================================
use_progress_checker: true
use_constraint_checker: false

# ===================================================================
# LATENT MODE - PERSISTENT
# ===================================================================
episodic_latent: false  # z initialized ONCE per episode, carried across steps
                        # RNN-like behavior - can accumulate information
                        # Theorem 5.9 doesn't strictly apply; uses Lemma 4.4

# ===================================================================
# CORE RL PARAMETERS
# ===================================================================
gamma: 0.99
K: 1                   # 1-step TD for fair comparison
inner_unroll_n: 4      # Latent unroll depth
max_edits: 20          # Episode budget for 4x4 Sudoku

# ===================================================================
# THEORY-EXACT FEATURES
# ===================================================================
exact_k_step_targets: true
exact_baseline_summation: false  # DISABLED: incompatible with persistent z (Theorem 5.9)
theory_exact_mixture: true       # Policy-space CPI mixture
distill_mixture_policy: false
batch_centered_advantage: true   # Use batch centering as heuristic for persistent z

# ===================================================================
# CONTRACTION & LIPSCHITZ
# ===================================================================
enable_contraction: true
target_Lz: 0.9
target_Lv: 1.0
latent_ball_radius: 10.0

# ===================================================================
# CONSERVATIVE POLICY IMPROVEMENT
# ===================================================================
mixture_alpha: 0.05

# ===================================================================
# REWARD SHAPING
# ===================================================================
reward_shaping: true
fail_terminal_reward: -16.0   # -C_max for rush-to-fail mitigation (C_max=16)
solve_terminal_reward: 0.0

# ===================================================================
# STOP ACTION
# ===================================================================
stop_action_mode: "disabled"  # Force agent to use full budget

# ===================================================================
# VALUE CLIPPING (must match score range)
# ===================================================================
value_target_clip: 20.0  # Progress checker range 0-16, add headroom

# ===================================================================
# OPTIMIZATION
# ===================================================================
value_lr: 3.0e-4
policy_lr: 1.0e-4
entropy_coef: 0.05            # Higher entropy for exploration
value_grad_clip: 5.0
policy_grad_clip: 1.0

# LR schedule - constant for stability
lr_schedule: "constant"
lr_warmup_steps: 0
lr_min_factor: 1.0

# ===================================================================
# REPLAY & TRAINING
# ===================================================================
replay_capacity: 100000
batch_size: 128               # Smaller for faster iteration
num_train_steps: 5000
rollout_episodes_per_step: 4
rollout_batch_size: 32

# ===================================================================
# LOGGING & EVALUATION
# ===================================================================
log_interval: 10
eval_interval: 100
eval_num_episodes: 50
use_tqdm: false
debug_checks: false
track_theory_metrics: true

# ===================================================================
# TASK CONFIGURATION
# ===================================================================
task_name: "sudoku"
solved_threshold: 16.0  # Progress checker: 16 = all cells filled
