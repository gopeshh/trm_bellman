# Config for 4x4 Sudoku with constraint-based checker
# This provides denser intermediate signals by rewarding constraint satisfaction
# (reducing row/column/box violations) rather than just matching the solution.

# Core training
gamma: 0.99
K: 3
inner_unroll_n: 4
max_edits: 20  # More edits for exploration

# Constraint-based checker (KEY CHANGE)
# Scores based on Sudoku constraint violations, not solution matching
use_constraint_checker: true

# Task configuration
task_name: sudoku
solved_threshold: 10.0  # Score of 10.0 = 0 violations = solved

# STOP action: disabled to prevent early termination
stop_action_mode: disabled

# Reward shaping with constraint-based potential
reward_shaping: true
fail_terminal_reward: -10.0  # Remark 2.6: ≤ -γC_max for rush-to-fail mitigation
solve_terminal_reward: 0.0

# Batch sizes
batch_size: 32
rollout_batch_size: 16

# Learning rates
value_lr: 0.0003
policy_lr: 0.0001
entropy_coef: 0.05  # Higher entropy for exploration

# Training
num_train_steps: 5000
eval_interval: 50
log_interval: 10

# Theory-exact features
exact_baseline_summation: true
exact_k_step_targets: true
theory_exact_mixture: true
enable_contraction: true
latent_ball_radius: 10.0
target_Lz: 0.9

# Episodic latent (default)
episodic_latent: true

# Advantage estimation
use_gae: true
gae_lambda: 0.95
batch_centered_advantage: false  # Use exact baseline instead

# CPI mixture
mixture_alpha: 0.05

# No distillation (theory-aligned)
distill_mixture_policy: false
