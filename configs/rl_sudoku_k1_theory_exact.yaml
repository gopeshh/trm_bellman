# Theory-exact UPI-TRM configuration for Sudoku (K=1)
# This config enables all theory-exact features from the paper

gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 120
num_train_steps: 20000
batch_size: 128
rollout_episodes_per_step: 6
mixture_alpha: 0.01      # very gentle CPI update
entropy_coef: 0.02
value_lr: 5e-5
policy_lr: 1e-4
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0
value_grad_clip: 2.0
policy_grad_clip: 0.25
value_target_clip: 2.0
advantage_clip: 2.0
policy_epsilon: 0.05

# Theory-exact features (matching the paper)
exact_k_step_targets: true      # Use fixed-horizon γ^K bootstrap for T_K^π operator
centered_advantage: true         # Use batch-centered 1-step actor-critic advantage
distill_mixture_policy: true     # Distill mixture distribution (1-α)π_old + απ_new

