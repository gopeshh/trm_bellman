# Full theory-exact UPI-TRM configuration
# Enables all theory features from the paper including new additions

gamma: 0.99
K: 5
inner_unroll_n: 4
max_edits: 120
num_train_steps: 20000
batch_size: 128
rollout_episodes_per_step: 6

# CPI / TRPO dials
mixture_alpha: 0.1
enable_kl_trust_region: true
trust_region_kl: 0.01

# Theory-exact toggles (Section 5-6)
exact_k_step_targets: true       # Use fixed-horizon γ^K bootstrap for T_K^π operator
centered_advantage: true          # Use batch-centered 1-step actor-critic advantage (Assumption 5.7)
distill_mixture_policy: true      # Distill mixture distribution (1-α)π_old + απ_new

# GAE for variance reduction (Section 6.2)
use_gae: true
gae_lambda: 0.95

# Optimization
entropy_coef: 0.02
value_lr: 0.0001
policy_lr: 0.0001
value_grad_clip: 5.0
policy_grad_clip: 1.0
value_target_clip: 200.0  # Scaled for 0-100 reward range
advantage_clip: 50.0      # Scaled for 0-100 reward range
policy_epsilon: 0.05

# Lipschitz / contraction dials (Section 4)
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0

# Monitoring (tracks C_z, L_z, L_v, Bellman residual)
track_theory_metrics: true
debug_checks: false

# Logging
log_interval: 100
eval_interval: 100
eval_num_episodes: 100

