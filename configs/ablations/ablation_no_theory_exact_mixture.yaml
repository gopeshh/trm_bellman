# Ablation: no_theory_exact_mixture
#
# Disables theory-exact CPI mixture (Issue 4).
# Tests: Parameter-space interpolation vs policy-space mixture.
# Expected: Similar performance but technically NOT CPI-compliant.
# Uses param.lerp_(candidate_param, α) instead of π_new = (1-α)π + απ_0.
#
# Changes from base theory-exact config:
#   - theory_exact_mixture: False
#
reward_shaping: true
use_progress_checker: true
use_constraint_checker: false
fail_terminal_reward: -16.0  # -C_max for progress checker (C_max=16)
solve_terminal_reward: 0.0
gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 20  # Fixed: was 120, should match paper_persistent_z_constraint.yaml
exact_k_step_targets: true
exact_baseline_summation: true
theory_exact_mixture: false
distill_mixture_policy: false
batch_centered_advantage: false
enable_contraction: true
target_Lz: 0.9
target_Lv: 1.0
latent_ball_radius: 10.0
mixture_alpha: 0.05
episodic_latent: true
stop_action_mode: noop
stop_action_penalty: -0.1
value_lr: 0.0003
policy_lr: 0.0003
entropy_coef: 0.01
value_grad_clip: 5.0
policy_grad_clip: 1.0
lr_schedule: cosine
lr_warmup_steps: 500
lr_min_factor: 0.1
replay_capacity: 100000
batch_size: 256
num_train_steps: 10000
rollout_episodes_per_step: 4
log_interval: 10
eval_interval: 50
eval_num_episodes: 50
use_tqdm: false
debug_checks: false
track_theory_metrics: true
task_name: sudoku
solved_threshold: 16.0  # Progress checker: 16 = all cells filled
