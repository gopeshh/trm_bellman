# =============================================================================
# Ablation config: Theory-exact UPI-TRM
# =============================================================================
# This config enables ALL theory-exact features from the ICML paper to match
# the CPI (Conservative Policy Improvement) analysis:
#
#   1. Reset-latent / episodic mode (episodic_latent: true) - clean Markov property
#   2. Exact baseline summation (Theorem 5.9) - enables O(α·ε_A) bound
#   3. Policy-space mixture (theory_exact_mixture: true) - proper CPI guarantee
#   4. No distillation - avoids projection error not covered by theory
#
# Use this config when you want maximum alignment with the paper's theory.
# =============================================================================

gamma: 0.99
K: 5
inner_unroll_n: 4
max_edits: 120
num_train_steps: 20000
batch_size: 128
rollout_episodes_per_step: 6
mixture_alpha: 0.1
entropy_coef: 0.02
value_lr: 0.0001
policy_lr: 0.0001
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0

# === Theory-exact features (matching CPI analysis) ===
exact_k_step_targets: true        # Use fixed-horizon γ^K bootstrap for T_K^π operator
exact_baseline_summation: true    # KEY: Enables O(α·ε_A) bound from Theorem 5.9
theory_exact_mixture: true        # Policy-space mixture (not param-space interpolation)
batch_centered_advantage: true    # Heuristic (variance reduction)
distill_mixture_policy: false     # DISABLED: Not covered by theory (Section 6.5)

# === Latent mode ===
# Episodic (reset-latent) for clean Markov property in theory analysis
episodic_latent: true

# === Reward shaping (required for exact_baseline_summation) ===
reward_shaping: true

# === Rush-to-fail mitigation (Paper Remark 2.6) ===
# Negative failure reward to prevent "rush to fail" under potential-based shaping.
# For 9x9 Sudoku with checker in [0, 81], set fail_terminal_reward ≤ -γ * 81 ≈ -80
fail_terminal_reward: -100.0

use_progress_checker: true
