# Ablation: no_theory_features
#
# Disables ALL theory-exact features (baseline RL).
# Tests: How much does the theory framework contribute?
# Expected: Worst performance, highest variance, possible divergence.
# This is a standard actor-critic baseline without UPI-TRM guarantees.
#
# Changes from base theory-exact config:
#   - enable_contraction: False
#   - target_Lz: 1.0
#   - exact_baseline_summation: False
#   - batch_centered_advantage: True
#   - mixture_alpha: 1.0
#   - latent_ball_radius: 0.0
#   - theory_exact_mixture: False
#   - exact_k_step_targets: False
#
reward_shaping: true
fail_terminal_reward: -10.0
solve_terminal_reward: 0.0
gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 120
exact_k_step_targets: false
exact_baseline_summation: false
theory_exact_mixture: false
distill_mixture_policy: false
batch_centered_advantage: true
enable_contraction: false
target_Lz: 1.0
target_Lv: 1.0
latent_ball_radius: 0.0
mixture_alpha: 1.0
episodic_latent: true
stop_action_mode: noop
stop_action_penalty: -0.1
value_lr: 0.0003
policy_lr: 0.0003
entropy_coef: 0.01
value_grad_clip: 5.0
policy_grad_clip: 1.0
lr_schedule: cosine
lr_warmup_steps: 500
lr_min_factor: 0.1
replay_capacity: 100000
batch_size: 256
num_train_steps: 10000
rollout_episodes_per_step: 4
log_interval: 10
eval_interval: 50
eval_num_episodes: 50
use_tqdm: false
debug_checks: false
track_theory_metrics: true
task_name: sudoku
solved_threshold: 10.0
