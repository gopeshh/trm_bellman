# Ablation config: Only centered advantage
# Tests the impact of Q-centered advantage estimator in isolation

gamma: 0.99
K: 5
inner_unroll_n: 4
max_edits: 120
num_train_steps: 20000
batch_size: 128
rollout_episodes_per_step: 6
mixture_alpha: 0.1
entropy_coef: 0.02
value_lr: 0.0001
policy_lr: 0.0001
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0

# Enable only batch-centered advantage (heuristic for variance reduction)
# NOTE: This is NOT the exact centering from Theorem 5.9
exact_k_step_targets: false
batch_centered_advantage: true
distill_mixture_policy: false

use_progress_checker: true
