# Ablation: no_exact_baseline
#
# Disables exact baseline summation (Theorem 5.9 - KEY CONTRIBUTION).
# Tests: Impact of O(α·ε_{A,0}) vs O(ε_A/(1-γ)) evaluation-error penalty.
# Expected: Weaker improvement guarantee, possibly more gradient variance.
# Uses batch-level centering instead (heuristic, not theory-exact).
#
# Changes from base theory-exact config:
#   - exact_baseline_summation: False
#   - batch_centered_advantage: True
#
reward_shaping: true
use_progress_checker: true
use_constraint_checker: false
fail_terminal_reward: -16.0  # -C_max for progress checker (C_max=16)
solve_terminal_reward: 0.0
gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 20  # Fixed: was 120, should match paper_persistent_z_constraint.yaml
exact_k_step_targets: true
exact_baseline_summation: false
theory_exact_mixture: true
distill_mixture_policy: false
batch_centered_advantage: true
enable_contraction: true
target_Lz: 0.9
target_Lv: 1.0
latent_ball_radius: 10.0
mixture_alpha: 0.05
episodic_latent: true
stop_action_mode: noop
stop_action_penalty: -0.1
value_lr: 0.0003
policy_lr: 0.0003
entropy_coef: 0.01
value_grad_clip: 5.0
policy_grad_clip: 1.0
lr_schedule: cosine
lr_warmup_steps: 500
lr_min_factor: 0.1
replay_capacity: 100000
batch_size: 256
num_train_steps: 10000
rollout_episodes_per_step: 4
log_interval: 10
eval_interval: 50
eval_num_episodes: 50
use_tqdm: false
debug_checks: false
track_theory_metrics: true
task_name: sudoku
solved_threshold: 16.0  # Progress checker: 16 = all cells filled
