# Ablation config: GAE-based advantage estimation
# Tests the impact of λ-returns (Section 6.2) in isolation

gamma: 0.99
K: 5
inner_unroll_n: 4
max_edits: 120
num_train_steps: 20000
batch_size: 128
rollout_episodes_per_step: 6
mixture_alpha: 0.1
entropy_coef: 0.02
value_lr: 0.0001
policy_lr: 0.0001
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0

# Enable GAE
use_gae: true
gae_lambda: 0.95

# Disable other theory-exact features
exact_k_step_targets: false
batch_centered_advantage: false
distill_mixture_policy: false

use_progress_checker: true
