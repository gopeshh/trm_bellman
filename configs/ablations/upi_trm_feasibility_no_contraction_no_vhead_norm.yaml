# UPI-TRM with Feasibility Checker - No Contraction, Value-Head Norm OFF
#
# Model A' for ICML Phase 1 unroll sensitivity experiment (v3).
# This is the FAIR BASELINE configuration:
# - Contraction DISABLED (no spectral normalization on z->z path)
# - Value-head normalization OFF (matching Model B to remove confound)
#
# This config differs from Model B ONLY in enable_contraction.
#
# Per CLAUDE.md non-negotiables:
# - use_feasibility_checker: true
# - disable_value_head_norm: true (CRITICAL for fair comparison with Model B)

gamma: 0.99
K: 1
inner_unroll_n: 2
max_edits: 16

num_train_steps: 5000
batch_size: 32
rollout_episodes_per_step: 4

value_lr: 0.0003
policy_lr: 0.0001
value_grad_clip: 1.0
policy_grad_clip: 0.5

mixture_alpha: 0.1
policy_epsilon: 0.1
target_ema_tau: 0.99

entropy_coef: 0.05

# ABLATION: No contraction enforcement (ONLY difference from Model B)
enable_contraction: false
target_Lz: 0.9  # Ignored when contraction disabled
# CRITICAL: Value-head normalization OFF to match Model B
disable_value_head_norm: true

value_target_clip: 50.0
advantage_clip: 10.0
batch_centered_advantage: true

log_interval: 50
eval_interval: 100
eval_num_episodes: 50

episodic_latent: true

# Forward-invariant projection (Assumption 4.1) - explicit for reproducibility
latent_ball_radius: 10.0

# Feasibility checker (matches Model B)
use_feasibility_checker: true
feasibility_violation_weight: 2.0
feasibility_zerocand_weight: 5.0
reward_shaping: true
solve_terminal_reward: 1.0
fail_terminal_reward: -16.0
C_max: 16.0
solved_threshold: null

stop_action_mode: disabled

# Theory metrics tracking
track_theory_metrics: true
