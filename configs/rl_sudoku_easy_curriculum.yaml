# UPI-TRM for Easy Sudoku Curriculum Learning
# Start with easier puzzles (40-50 clues) to learn basic editing behavior

gamma: 0.99
K: 3                  # Multi-step for faster credit assignment
inner_unroll_n: 4
max_edits: 60         # Easy puzzles need fewer edits (31-41 empty cells)
num_train_steps: 5000
batch_size: 128
rollout_episodes_per_step: 4
mixture_alpha: 0.05   # Faster policy updates for easier task
entropy_coef: 0.05    # Moderate exploration
value_lr: 0.0001      # Standard LR (easier task = more stable)
policy_lr: 0.0001
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0
log_interval: 50
eval_interval: 100
eval_num_episodes: 50
value_grad_clip: 5.0
policy_grad_clip: 1.0
value_target_clip: 100.0
advantage_clip: 20.0
policy_epsilon: 0.05
target_ema_tau: 0.99
batch_centered_advantage: true
episodic_latent: false   # Persistent z for memory across edits
lr_schedule: constant
lr_warmup_steps: 0
lr_min_factor: 1.0
stop_action_mode: noop   # Don't penalize STOP too harshly during learning
stop_action_penalty: -0.1

