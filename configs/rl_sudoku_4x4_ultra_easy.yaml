# Ultra-easy 4x4 Sudoku - SPARSE REWARDS
# Simple: +1 for solve, 0 otherwise

gamma: 0.99
K: 1
inner_unroll_n: 1

max_edits: 10

num_train_steps: 5000
batch_size: 32
rollout_episodes_per_step: 8

value_lr: 0.001
policy_lr: 0.003
value_grad_clip: 1.0
policy_grad_clip: 1.0

mixture_alpha: 0.5
policy_epsilon: 0.3         # High exploration
target_ema_tau: 0.95

entropy_coef: 0.3           # Very high entropy for exploration
enable_contraction: false
value_target_clip: 5.0
advantage_clip: 5.0
batch_centered_advantage: true

log_interval: 50
eval_interval: 100
eval_num_episodes: 50

episodic_latent: true

# SPARSE rewards - only get reward at terminal state
reward_shaping: false       # NO shaping - sparse terminal reward only
solve_terminal_reward: 1.0  # +1 for solving
fail_terminal_reward: 0.0   # 0 for not solving

stop_action_mode: disabled
