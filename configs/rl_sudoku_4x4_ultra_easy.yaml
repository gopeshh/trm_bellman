# Ultra-easy 4x4 Sudoku - IMITATION + CONSERVATIVE RL
# After imitation pretraining, use very conservative RL to avoid catastrophic forgetting

gamma: 0.99
K: 1
inner_unroll_n: 1

max_edits: 10

num_train_steps: 5000
batch_size: 32
rollout_episodes_per_step: 4

value_lr: 0.0003            # Slow value learning
policy_lr: 0.0001           # Very slow policy updates to preserve imitation
value_grad_clip: 1.0
policy_grad_clip: 0.5       # Tight gradient clipping

# VERY conservative CPI to preserve imitation-learned policy
mixture_alpha: 0.05         # Small policy updates
policy_epsilon: 0.1         # Low exploration - policy is already good
target_ema_tau: 0.99        # Slow target updates

entropy_coef: 0.01          # Low entropy - don't randomize good policy
enable_contraction: false
value_target_clip: 5.0
advantage_clip: 2.0         # Tighter advantage clipping
batch_centered_advantage: true

log_interval: 50
eval_interval: 100
eval_num_episodes: 50

episodic_latent: true

# Reward shaping to guide learning
reward_shaping: true
solve_terminal_reward: 1.0
fail_terminal_reward: 0.0

stop_action_mode: disabled
