# ============================================================
# CONSTRAINT CHECKER ABLATION: No Conservative Mixture
# ============================================================
# Tests CPI benefit: mixture_alpha = 1.0 (full update)
# Difference: mixture_alpha: 1.0

use_constraint_checker: true
use_progress_checker: false
task_name: sudoku
solved_threshold: 10.0

reward_shaping: true
fail_terminal_reward: -10.0
solve_terminal_reward: 0.0
value_target_clip: 15.0

gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 20
num_train_steps: 5000

episodic_latent: true

# NOTE: Using batch_centered_advantage for faster training
# (exact_baseline_summation tested in ablation_no_exact_baseline)
exact_baseline_summation: false
batch_centered_advantage: true
exact_k_step_targets: true
theory_exact_mixture: true
distill_mixture_policy: false

enable_contraction: true
target_Lz: 0.9
target_Lv: 1.0
latent_ball_radius: 10.0

# ABLATION: No conservative mixture (full update)
mixture_alpha: 1.0  # <-- FULL UPDATE

stop_action_mode: "disabled"

value_lr: 3.0e-4
policy_lr: 1.0e-4
entropy_coef: 0.05
lr_schedule: "constant"

replay_capacity: 100000
batch_size: 128
rollout_episodes_per_step: 4

log_interval: 10
eval_interval: 100
eval_num_episodes: 50
track_theory_metrics: true
