# ============================================================
# CONSTRAINT CHECKER ABLATION: No Theory Features
# ============================================================
# Baseline actor-critic without any UPI-TRM theory features
# Tests: How much does the theory framework contribute?

use_constraint_checker: true
use_progress_checker: false
task_name: sudoku
solved_threshold: 10.0

reward_shaping: true
fail_terminal_reward: -10.0
solve_terminal_reward: 0.0
value_target_clip: 15.0

gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 20
num_train_steps: 5000

episodic_latent: true  # Episodic (simpler)

# ALL THEORY FEATURES DISABLED
exact_baseline_summation: false
exact_k_step_targets: false
theory_exact_mixture: false
batch_centered_advantage: true
distill_mixture_policy: false

enable_contraction: false
target_Lz: 1.0
target_Lv: 1.0
latent_ball_radius: 0.0

mixture_alpha: 1.0  # No conservative update

stop_action_mode: "noop"
stop_action_penalty: -0.1

value_lr: 3.0e-4
policy_lr: 3.0e-4
entropy_coef: 0.01
lr_schedule: "cosine"
lr_warmup_steps: 500
lr_min_factor: 0.1

replay_capacity: 100000
batch_size: 256
rollout_episodes_per_step: 4

log_interval: 10
eval_interval: 100  # Standardized across all experiments
eval_num_episodes: 50
track_theory_metrics: true
