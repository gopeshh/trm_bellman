# Baseline UPI-TRM configuration for Sudoku (K=1)
# This config does NOT enable the theory-exact toggles; it's a simpler baseline.

gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 120
num_train_steps: 20000
batch_size: 128
rollout_episodes_per_step: 6
mixture_alpha: 0.01
entropy_coef: 0.02
value_lr: 0.00005
policy_lr: 0.0001
enable_contraction: true
target_Lz: 0.9
target_Lv: 5.0
log_interval: 100
eval_interval: 100
eval_num_episodes: 100
value_grad_clip: 2.0
policy_grad_clip: 0.25
value_target_clip: 2.0
advantage_clip: 2.0
policy_epsilon: 0.05

