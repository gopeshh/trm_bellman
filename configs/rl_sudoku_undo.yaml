# Theory-Exact UPI-TRM with UNDO Action for Sudoku
#
# This configuration enables the UNDO action variant (IMPLEMENTATION_GUIDELINE Phase 5.4).
# UNDO allows the agent to revert to previous plan states, enabling exploration
# without permanently committing to edits.
#
# Action space with UNDO:
#   num_actions = seq_len * vocab_size + 2  (edit actions + STOP + UNDO)
#   - Actions 0 to (seq_len * vocab_size - 1): edit actions
#   - Action seq_len * vocab_size: STOP
#   - Action seq_len * vocab_size + 1: UNDO
#
# UNDO behavior:
#   - Reverts to the previous plan state from edit history
#   - Masked out when history has only 1 entry (initial state)
#   - No termination, episode continues after UNDO
#
# All other settings match rl_sudoku_shaped_theory_exact.yaml for fair comparison.

# ===================================================================
# UNDO ACTION (Phase 5.4)
# ===================================================================
enable_undo: true  # Enable UNDO action

# ===================================================================
# REWARD SHAPING (Section 2.3, Remark 2.6)
# ===================================================================
reward_shaping: true
fail_terminal_reward: -10.0   # -C_max for theory alignment
solve_terminal_reward: 0.0

# ===================================================================
# CORE RL PARAMETERS
# ===================================================================
gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 120

# ===================================================================
# THEORY-EXACT FEATURES (Section 5, Theorem 5.9)
# ===================================================================
exact_k_step_targets: true
exact_baseline_summation: true
theory_exact_mixture: true
distill_mixture_policy: false
batch_centered_advantage: false

# ===================================================================
# CONTRACTION & LIPSCHITZ (Assumption 4.1, 4.2)
# ===================================================================
enable_contraction: true
target_Lz: 0.9
target_Lv: 1.0
latent_ball_radius: 10.0

# ===================================================================
# CONSERVATIVE POLICY IMPROVEMENT (Dial 'α')
# ===================================================================
mixture_alpha: 0.05

# ===================================================================
# LATENT MODE
# ===================================================================
episodic_latent: true

# ===================================================================
# STOP ACTION BEHAVIOR
# ===================================================================
stop_action_mode: "noop"
stop_action_penalty: -0.1

# ===================================================================
# OPTIMIZATION
# ===================================================================
value_lr: 3.0e-4
policy_lr: 3.0e-4
entropy_coef: 0.01
value_grad_clip: 5.0
policy_grad_clip: 1.0

lr_schedule: "cosine"
lr_warmup_steps: 500
lr_min_factor: 0.1

# ===================================================================
# REPLAY & TRAINING
# ===================================================================
replay_capacity: 100000
batch_size: 256
num_train_steps: 10000
rollout_episodes_per_step: 4

# ===================================================================
# LOGGING & EVALUATION
# ===================================================================
log_interval: 10
eval_interval: 50
eval_num_episodes: 50
use_tqdm: false
debug_checks: false
track_theory_metrics: true

# ===================================================================
# TASK CONFIGURATION
# ===================================================================
task_name: "sudoku"
solved_threshold: 10.0

# Note: When using this config, the trainer must set:
#   rl_num_actions = seq_len * vocab_size + 2  (not + 1)
#   env.set_stop_action_id(seq_len * vocab_size)  # STOP
#   env.set_undo_action_id(seq_len * vocab_size + 1)  # UNDO (optional, auto-set)
