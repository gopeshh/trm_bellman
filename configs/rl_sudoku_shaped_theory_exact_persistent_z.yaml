# Theory-Aligned Shaped Rewards for Sudoku with PERSISTENT LATENT z
#
# This configuration uses most theory features from rl_sudoku_shaped_theory_exact.yaml
# EXCEPT: episodic_latent is FALSE (persistent z mode)
#
# IMPORTANT THEORY NOTE (Section 5.4):
# With persistent z (episodic_latent=false), the exact_baseline_summation feature
# becomes the "memoryless approximation" and Theorem 5.9's O(α·ε_A) bound does NOT
# strictly apply. We disable exact_baseline_summation for compatibility and use
# batch_centered_advantage as a heuristic instead.
#
# In persistent z mode, the latent z is initialized once per episode
# and carried across steps (RNN-like), rather than being reset at each step.
#
# Paper Reference: Lemma 4.4 (two-timescale bound for persistent-latent analysis)

# ===================================================================
# REWARD SHAPING (Section 2.3, Remark 2.6)
# ===================================================================
reward_shaping: true
fail_terminal_reward: -10.0   # -C_max for theory alignment
solve_terminal_reward: 0.0

# ===================================================================
# CORE RL PARAMETERS
# ===================================================================
gamma: 0.99
K: 1
inner_unroll_n: 4
max_edits: 120

# ===================================================================
# THEORY FEATURES (Section 5, with persistent z adaptations)
# ===================================================================
# NOTE: With persistent z (episodic_latent=false), exact_baseline_summation
# becomes the "memoryless approximation" from Section 5.4. Theorem 5.9's
# O(α·ε_A) bound does NOT strictly apply in this regime.
# We disable exact_baseline_summation for compatibility.
exact_k_step_targets: true
exact_baseline_summation: false  # DISABLED: incompatible with persistent z (Section 5.4)
theory_exact_mixture: true
distill_mixture_policy: false
batch_centered_advantage: true  # Use batch centering as heuristic instead

# ===================================================================
# CONTRACTION & LIPSCHITZ (Assumption 4.1, 4.2)
# ===================================================================
enable_contraction: true
target_Lz: 0.9
target_Lv: 1.0
latent_ball_radius: 10.0

# ===================================================================
# CONSERVATIVE POLICY IMPROVEMENT (Dial 'α')
# ===================================================================
mixture_alpha: 0.05

# ===================================================================
# LATENT MODE - KEY DIFFERENCE FROM EPISODIC VERSION
# ===================================================================
# PERSISTENT z mode: z is initialized once per episode and carried across steps
# This is different from episodic mode where z is reset at every step
episodic_latent: false

# ===================================================================
# STOP ACTION BEHAVIOR
# ===================================================================
stop_action_mode: "noop"
stop_action_penalty: -0.1

# ===================================================================
# OPTIMIZATION (adjusted for persistent z stability)
# ===================================================================
value_lr: 1.0e-4     # Lower LR for stability with persistent z
policy_lr: 1.0e-4    # Lower LR for stability
entropy_coef: 0.05   # Higher entropy to prevent policy collapse
value_grad_clip: 5.0
policy_grad_clip: 1.0

# LR schedule - constant for persistent z stability
lr_schedule: "constant"
lr_warmup_steps: 0
lr_min_factor: 1.0

# ===================================================================
# REPLAY & TRAINING
# ===================================================================
replay_capacity: 100000
batch_size: 256
num_train_steps: 10000
rollout_episodes_per_step: 4

# ===================================================================
# LOGGING & EVALUATION
# ===================================================================
log_interval: 10
eval_interval: 50
eval_num_episodes: 50
use_tqdm: false
debug_checks: false
track_theory_metrics: true

# ===================================================================
# TASK CONFIGURATION
# ===================================================================
task_name: "sudoku"
solved_threshold: 10.0
